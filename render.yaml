databases:
  - name: fundi-db
    plan: free

services:
  - type: web
    name: fundi-platform
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn fundi.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DATABASE_URL
        fromDatabase:
          name: fundi-db
          property: connectionString
      - key: WHATSAPP_NUMBER
        value: "254113781366"
